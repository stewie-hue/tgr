name: Build TGram Reborn APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # GitHub's Ubuntu runner already includes the Android SDK. Do not invoke
      # android-actions/setup-android@v3: its default package list requests the
      # obsolete SDK package named "tools" and fails before the build starts.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "Android platform 35 is missing from the runner SDK."; ls -la "$ANDROID_HOME/platforms" || true; exit 1; }
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt" || { echo "Android build-tools 35.0.0 are missing from the runner SDK."; ls -la "$ANDROID_HOME/build-tools" || true; exit 1; }
          echo "Android SDK platform 35 and build-tools 35.0.0 are available."
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tgram-reborn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
